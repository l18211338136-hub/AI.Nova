<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据查询报表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-screen-lg mx-auto bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold mb-4">数据查询报表</h1>

        <!-- 折线图 -->
        <div id="lineChart" style="width: 100%; height: 400px;"></div>
        <script type="text/javascript">
            var lineChart = echarts.init(document.getElementById('lineChart'));
            var lineData = [
                { month: '2025/4/30', totalquantity: 158, totalamount: 18328 },
                // ... 其他数据
            ];
            var lineOption = {
                title: {
                    text: '按月销售数量和总金额'
                },
                tooltip: {
                    trigger: 'axis'
                },
                legend: {
                    data: ['销售数量', '总金额']
                },
                xAxis: {
                    type: 'category',
                    data: lineData.map(item => item.month)
                },
                yAxis: {
                    type: 'value'
                },
                series: [
                    {
                        name: '销售数量',
                        type: 'line',
                        data: lineData.map(item => item.totalquantity)
                    },
                    {
                        name: '总金额',
                        type: 'line',
                        data: lineData.map(item => item.totalamount)
                    }
                ]
            };
            lineChart.setOption(lineOption);
        </script>

        <!-- 柱状图 -->
        <div id="barChart" style="width: 100%; height: 400px;"></div>
        <script type="text/javascript">
            var barChart = echarts.init(document.getElementById('barChart'));
            var barData = [
                { name: '2013极速跑车日历', totalquantity: 2116 },
                // ... 其他数据
            ];
            var barOption = {
                title: {
                    text: '销售数量排名'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: barData.map(item => item.name)
                },
                yAxis: {
                    type: 'value'
                },
                series: [
                    {
                        name: '销售数量',
                        type: 'bar',
                        data: barData.map(item => item.totalquantity)
                    }
                ]
            };
            barChart.setOption(barOption);
        </script>

        <!-- 表格 -->
        <h2 class="mt-6 text-xl font-bold">销售数量排名</h2>
        <table class="w-full border-collapse">
            <thead>
                <tr>
                    <th class="border px-4 py-2">商品名称</th>
                    <th class="border px-4 py-2">销售数量</th>
                </tr>
            </thead>
            <tbody>
                <!-- 数据行 -->
                <tr>
                    <td>PS4_Slim</td>
                    <td>2116</td>
                </tr>
                <!-- ... 其他数据行 -->
            </tbody>
        </table>

        <h2 class="mt-6 text-xl font-bold">平均销售单价和最高销售单价</h2>
        <table class="w-full border-collapse">
            <thead>
                <tr>
                    <th class="border px-4 py-2">商品名称</th>
                    <th class="border px-4 py-2">平均销售单价</th>
                    <th class="border px-4 py-2">最高销售单价</th>
                </tr>
            </thead>
            <tbody>
                <!-- 数据行 -->
                <tr>
                    <td>2013极速跑车日历</td>
                    <td>58.00</td>
                    <td>58.00</td>
                </tr>
                <!-- ... 其他数据行 -->
            </tbody>
        </table>
    </div>
</body>
</html>
